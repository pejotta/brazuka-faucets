<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo-brazuka.png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- SEO Dinâmico (Canonical e Meta Description serão atualizados via JS) -->
    <link rel="canonical" id="canonical-link" href="https://www.brazukafaucets.com.br/moeda.html" />
    <meta name="description" id="meta-desc" content="Confira as melhores faucets auditadas para coletar criptomoedas gratuitamente no Brazuka Faucets." />
    <title id="page-title">Faucets de Criptomoedas | Brazuka Faucets</title>
</head>
<body>

    <div id="header-placeholder"></div>
    <div class="ad-slot-top" style="margin: 20px auto;"></div>

    <main class="container">
        <section class="headline" style="text-align: center;">
            <h1 id="coin-heading">Carregando Faucets...</h1>
            <p id="coin-subtitle">Confira as melhores opções verificadas para coletar gratuitamente.</p>
        </section>

        <!-- GRID ONDE AS FAUCETS DA MOEDA SERÃO CARREGADAS -->
        <div id="dynamic-coin-grid" class="faucet-grid" style="margin: 30px 0 50px 0;">
            <p style="text-align: center; color: #888;">Buscando faucets disponíveis...</p>
        </div>

        <div style="text-align: center; margin-bottom: 40px;">
            <a href="todas-as-moedas.html" class="view-more">← Voltar para Todas as Moedas</a>
        </div>
    </main>

    <div class="ad-slot-top" style="margin: 20px auto;"></div>
    <div id="footer-placeholder"></div>

    <script src="js/script-global.js"></script>
    <script src="js/ads-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Pega a sigla da URL (ex: moeda.html?c=g$ -> "g$")
            const params = new URLSearchParams(window.location.search);
            const coinSigla = (params.get('c') || 'btc').toLowerCase().trim();

            let nomeExibicao = coinSigla.toUpperCase();

            // 2. Busca o nome completo da moeda direto no moedas.json (Zero edição manual!)
            try {
                const res = await fetch('moedas.json');
                if (res.ok) {
                    const listaMoedas = await res.json();
                    const moedaEncontrada = listaMoedas.find(m => m.sigla.toLowerCase() === coinSigla);
                    if (moedaEncontrada) {
                        nomeExibicao = `${moedaEncontrada.nome} (${moedaEncontrada.sigla.toUpperCase()})`;
                    }
                }
            } catch (erro) {
                console.warn('Não foi possível ler moedas.json, usando sigla padrão:', erro);
            }

            // 3. Atualiza SEO (Título, Canonical e Descrição) para o Google indexar como página única
            const urlOficial = `https://www.brazukafaucets.com.br/moeda.html?c=${encodeURIComponent(coinSigla)}`;
            document.getElementById('canonical-link').setAttribute('href', urlOficial);
            document.title = `Melhores Faucets de ${nomeExibicao} | Brazuka Faucets`;
            document.getElementById('meta-desc').setAttribute('content', `Lista atualizada das melhores faucets pagando em ${nomeExibicao}. Colete grátis e direto na sua carteira.`);

            // 4. Atualiza os textos visíveis na tela
            document.getElementById('coin-heading').innerText = `Faucets de ${nomeExibicao}`;
            document.getElementById('coin-subtitle').innerText = `Lista completa e auditada de faucets pagando em ${nomeExibicao}.`;

            // 5. Chama a função que carrega as faucets no grid (ajustar conforme o nome da função no seu script-global.js)
            if (typeof carregarFaucetsPorMoeda === 'function') {
                carregarFaucetsPorMoeda(coinSigla, 'dynamic-coin-grid');
            }
        });
    </script>
</body>
</html>
