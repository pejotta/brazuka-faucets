<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/assets/logo-brazuka.png" sizes="32x32">
    <link rel="shortcut icon" href="/assets/logo-brazuka.png">
    <link rel="apple-touch-icon" href="/assets/logo-brazuka.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <meta http-equiv="content-language" content="pt-BR" />
    <title>Reportar Faucet / Erro | Brazuka Faucets</title>
    <meta name="description" content="Encontrou algum erro, link quebrador ou faucet scam? Relate para nossa equipe." />
    <meta name="author" content="Pejotta" />
    <meta name="theme-color" content="#1a73e8">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-11KQEGEBZ3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-11KQEGEBZ3');
    </script>

    <style>
        .hero-ads {
            text-align: center; padding: 60px 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white; border-radius: 0 0 50px 50px; max-width: 1200px; margin: 0 auto;
        }
        .hero-ads h1 { font-size: 2.5em; margin-bottom: 10px; }
        .hero-ads p { opacity: 0.9; font-size: 1.1em; }
        
        .faucet-form-container {
            max-width: 600px; margin: 50px auto; background: #ffffff;
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative; z-index: 2;
        }
        .faucet-form h2 { color: #e74c3c; margin-bottom: 25px; text-align: center; font-size: 1.6em; }
        .faucet-form label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 0.95em; }
        .faucet-form input, .faucet-form select, .faucet-form textarea {
            width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1em; box-sizing: border-box;
        }
        .faucet-form button {
            width: 100%; background-color: #e74c3c; color: white; padding: 15px;
            border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .faucet-form button:hover:not(:disabled) { background-color: #c0392b; }
        .faucet-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .banner-lateral {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 160px; height: 600px; z-index: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .banner-left { left: 20px; } 
        .banner-right { right: 20px; }
        
        @media (max-width: 1200px) { .banner-lateral { display: none; } }
    </style>
</head>
<body>

    <!-- Banners Laterais Esquerdo e Direito -->
    <div class="banner-lateral banner-left">
        <div id="ad-modal-left"></div>
    </div>

    <div class="banner-lateral banner-right">
        <div id="ad-modal-right"></div>
    </div>

    <section class="hero-ads">
        <h1>Reportar Faucet / Erro</h1>
        <p>Encontrou um site scam, link quebrado ou problemas de pagamento? Avise-nos.</p>
    </section>
    
    <main class="container">
        <div class="faucet-form-container">
            <form action="https://api.web3forms.com/submit" method="POST" class="faucet-form">
                
                <!-- Configurações do Web3Forms -->
                <input type="hidden" name="access_key" value="f929ba8a-9ec8-46f4-a61c-d11dfb40de7e">
                <input type="hidden" name="subject" value="🚨 Report / Alerta de Faucet - Brazuka Faucets">
                <input type="hidden" name="from_name" value="Brazuka Reports">

                <h2><i class="fa-solid fa-triangle-exclamation"></i> Enviar Relatório</h2>
                
                <label>Seu Nome *</label>
                <input type="text" name="name" placeholder="Seu nome ou apelido" required>

                <label>Seu E-mail *</label>
                <input type="email" name="email" placeholder="seu-email@exemplo.com" required>

                <label>Detalhes do Report (Nome do site, URL e motivo) *</label>
                <textarea name="message" rows="5" placeholder="Ex: A faucet X em https://... parou de pagar / virou scam / link quebrado." required></textarea>
                
                <div class="cf-turnstile" data-sitekey="0x4AAAAAACIz3XQpjGaXppF0" data-callback="onTurnstileSuccess" style="margin-bottom: 20px;"></div>
                <button type="submit" id="btn-reportar" disabled>🚨 Enviar Relatório</button>
            </form>
        </div>
    </main>

    <script>
        const btn = document.getElementById('btn-reportar');
        window.onTurnstileSuccess = (token) => {
            btn.disabled = false;
        };
    </script>
    <script src="js/ticker-data.js"></script>
    <script src="js/script-global.js"></script>
    <script src="js/ads-manager.js"></script>
</body>
</html>
