<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazuka Command Center | Gerador Banco de Dados</title>
    
    <script>
    (function() {
        const SENHA_MESTRA = "Umabrazukanova2025historia"; 
        let acesso = sessionStorage.getItem('autenticado');
        if (acesso !== 'true') {
            let tentativa = prompt("Acesso Administrativo! Digite a senha:");
            if (tentativa === SENHA_MESTRA) {
                sessionStorage.setItem('autenticado', 'true');
            } else {
                alert("Acesso negado!");
                window.location.href = "index.html";
            }
        }
    })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root { --primary: #1a73e8; --dark-blue: #0d47a1; --success: #27ae60; --cloud: #00a1ff; --warning: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .hero-ads {
            text-align: center; width: 90%; padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--dark-blue) 100%);
            color: white; border-radius: 0 0 50px 50px; margin-bottom: 30px;
        }

        .main-wrapper { display: flex; gap: 20px; max-width: 1300px; width: 95%; margin-bottom: 50px; }
        
        .faucet-form-container {
            flex: 1.2; background: #ffffff; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .output-wrapper { flex: 0.8; position: sticky; top: 20px; height: fit-content; }

        h2 { color: var(--primary); text-align: center; font-size: 1.5em; margin-bottom: 20px; }
        h3 { font-size: 0.9em; color: #666; text-transform: uppercase; margin-top: 25px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #333; font-size: 0.9em; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95em; box-sizing: border-box;
        }

        .id-group { display: flex; gap: 10px; align-items: flex-end; }
        .btn-buscar {
            background: var(--warning); color: white; border: none; padding: 12px 20px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; height: 45px;
        }
        .btn-buscar:hover { background: #e67e22; }

        .checkbox-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px;
            background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 5px;
        }
        .check-item { display: flex; align-items: center; font-size: 0.85em; cursor: pointer; }
        .check-item input { width: auto; margin-right: 8px; }

        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }

        .btn-gerar {
            background: var(--primary); color: white; padding: 18px;
            border: none; border-radius: 50px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }

        .btn-cloudflare {
            background: var(--cloud); color: white; padding: 18px;
            border: none; border-radius: 50px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        .btn-cloudflare:disabled { background: #ccc; cursor: not-allowed; }
        .btn-cloudflare:hover:not(:disabled) { background: #0081cc; transform: translateY(-2px); }

        #json-output {
            width: 100%; height: 500px; background: #1e1e1e; color: #76ff03;
            padding: 20px; border-radius: 15px; font-family: 'Consolas', monospace;
            font-size: 12px; border: none; box-sizing: border-box; resize: none;
        }
        .copy-btn {
            width: 100%; background: var(--success); color: white; padding: 12px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        @media (max-width: 1000px) { .main-wrapper { flex-direction: column; } .output-wrapper { position: static; } }
    </style>
</head>
<body>

    <section class="hero-ads">
        <h1>Brazuka Command Center</h1>
        <p>Olá Pejotta! Gerencie o Banco de Dados em tempo real.</p>
    </section>

    <div class="main-wrapper">
        <div class="faucet-form-container">
            <h2><i class="fa-solid fa-server"></i> Painel da Faucet</h2>
            
            <label>ID da Faucet (Para editar ou criar)</label>
            <div class="id-group">
                <input type="number" id="f_id" placeholder="Ex: 105">
                <button type="button" class="btn-buscar" onclick="buscarFaucetsNoBanco()">
                    <i class="fa-solid fa-magnifying-glass"></i> CARREGAR
                </button>
            </div>

            <label>Nome da Faucet</label>
            <input type="text" id="f_nome" placeholder="Ex: Brazuka Claimer">

            <label>URL de Indicação</label>
            <input type="url" id="f_url" placeholder="https://...">

            <label>Moedas (Separe por vírgula)</label>
            <input type="text" id="f_moedas" placeholder="btc, eth, doge">

            <label>Data Cadastro</label>
            <input type="text" id="f_data" placeholder="26/12/2025">

            <h3>Classificação</h3>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" class="tipo-p" value="Faucet Padrão"> Faucet Padrão</label>
                <label class="check-item"><input type="checkbox" class="tipo-p" value="Autofaucet"> Auto Faucet</label>
                <label class="check-item"><input type="checkbox" class="tipo-p" value="Central Multitarefas"> Central</label>
                <label class="check-item"><input type="checkbox" class="tipo-p" value="Mineradora"> Mineradora</label>
            </div>

            <h3>Recursos</h3>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" class="recurso" value="faucet"> Faucet</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="bonus"> Bônus diário</label>                
                <label class="check-item"><input type="checkbox" class="recurso" value="ptc"> PTC</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="concursos"> Concursos</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="shortlinks"> Shortlinks</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="surveys"> Surveys</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="staking"> Staking</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="jogos"> Jogos</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="jobs"> Trabalhos</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="surfads"> SurfAds</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="microtasks"> Micro Tarefas</label>
                <label class="check-item"><input type="checkbox" class="recurso" value="offerwall"> Offerwalls</label>
            </div>

            <h3>Segurança e Pagamento</h3>
            <label>Intervalo do Timer</label>
            <input type="text" id="f_timer" placeholder="Ex: 60 minutos">

            <label>Captchas Utilizados</label>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" class="captcha-c" value="reCAPTCHA"> reCAPTCHA</label>
                <label class="check-item"><input type="checkbox" class="captcha-c" value="hCaptcha"> hCaptcha</label>
                <label class="check-item"><input type="checkbox" class="captcha-c" value="Turnstile"> Turnstile</label>
                <label class="check-item"><input type="checkbox" class="captcha-c" value="IconCaptcha"> IconCaptcha</label>
                <label class="check-item"><input type="checkbox" class="captcha-c" value="Antibot"> Antibot</label>
                <label class="check-item"><input type="checkbox" class="captcha-c" value="Custom"> Próprio</label>
            </div>

            <label>Onde Paga?</label>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" class="pagto-c" value="FaucetPay"> FaucetPay</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Metamask"> Metamask</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Binance"> Binance</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Coinbase"> Coinbase</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Cwallet"> Cwallet</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Payeer"> Payeer</label>
                <label class="check-item"><input type="checkbox" class="pagto-c" value="Carteira Direta"> Carteira Direta</label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <div>
                    <label>Mínimo Saque</label>
                    <input type="text" id="f_minimo" placeholder="0.01 USD">
                </div>
                <div>
                    <label>Tempo Saque</label>
                    <input type="text" id="f_tempo" placeholder="Imediato">
                </div>
            </div>

            <h3>Status e Destaque</h3>
            <select id="f_status">
                <option value="paying">Paga Regularmente ✅</option>
                <option value="pending">Em Análise ⚠️</option>
                <option value="scam">SCAM / Não Paga ❌</option>
            </select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <div>
                    <label>Destacar</label>
                    <select id="f_destaque"><option value="false">Normal</option><option value="true">Destaque ⭐</option></select>
                </div>
                <div>
                    <label>Patrocinado</label>
                    <select id="f_patrocinado"><option value="false">Grátis</option><option value="true">VIP 💎</option></select>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-gerar" onclick="gerarJSON()">1. VISUALIZAR JSON</button>
                <button id="btnCloud" class="btn-cloudflare" onclick="enviarParaCloudflare()" disabled>
                    <i class="fa-solid fa-cloud-arrow-up"></i> 2. SALVAR NO BANCO DE DADOS
                </button>
            </div>
        </div>

        <div class="output-wrapper">
            <textarea id="json-output" placeholder="O código JSON aparecerá aqui..." readonly></textarea>
            <button class="copy-btn" onclick="copiarTexto()">📋 COPIAR PARA BACKUP</button>
        </div>
    </div>

    <script>
        let ultimoObjetoGerado = null;
        // INSIRA A URL DA SUA WORKER AQUI:
        const URL_WORKER = "https://brazuka-faucets.moneynanet-yt.workers.dev";

        async function buscarFaucetsNoBanco() {
            const id = document.getElementById('f_id').value;
            if (!id) return alert("Pejotta, digite o ID primeiro para eu buscar!");

            const btnBusca = document.querySelector('.btn-buscar');
            btnBusca.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const response = await fetch(`${URL_WORKER}/get-all-faucets`);
                const faucets = await response.json();
                const f = faucets.find(item => item.id == id);

                if (f) {
                    // Preenchimento de campos de texto
                    document.getElementById('f_nome').value = f.nome || '';
                    document.getElementById('f_url').value = f.url || '';
                    document.getElementById('f_moedas').value = Array.isArray(f.moeda) ? f.moeda.join(', ') : f.moeda;
                    document.getElementById('f_timer').value = f.intervalo || '';
                    document.getElementById('f_minimo').value = f.minimo_saque || '';
                    document.getElementById('f_tempo').value = f.tempo_saque || '';
                    document.getElementById('f_status').value = f.status || 'paying';
                    document.getElementById('f_destaque').value = String(f.destaque);
                    document.getElementById('f_patrocinado').value = String(f.patrocinado);

                    // Lógica para marcar Checkboxes
                    const marcarChecks = (seletor, valorString) => {
                        const listaValores = valorString ? valorString.split(/[,/]/).map(v => v.trim()) : [];
                        document.querySelectorAll(seletor).forEach(cb => {
                            cb.checked = listaValores.includes(cb.value);
                        });
                    };

                    // Marca as categorias (Tipos)
                    const listaTipos = f.tipo_principal ? f.tipo_principal.split(' e ').map(v => v.trim()) : [];
                    document.querySelectorAll('.tipo-p').forEach(cb => cb.checked = listaTipos.includes(cb.value));

                    // Marca os recursos (que já é um array)
                    document.querySelectorAll('.recurso').forEach(cb => {
                        cb.checked = f.recursos && f.recursos.includes(cb.value);
                    });

                    // Marca os outros
                    marcarChecks('.captcha-c', f.captcha);
                    marcarChecks('.pagto-c', f.pagamento);

                    alert("✅ Dados de '" + f.nome + "' carregados! Pode editar agora.");
                } else {
                    alert("❌ Faucet não encontrada com esse ID no Banco de Dados.");
                }
            } catch (err) {
                alert("🚨 Erro ao conectar com o Banco de Dados!");
                console.error(err);
            } finally {
                btnBusca.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> CARREGAR';
            }
        }

        function gerarJSON() {
            const tipos = Array.from(document.querySelectorAll('.tipo-p:checked')).map(c => c.value);
            const recursos = Array.from(document.querySelectorAll('.recurso:checked')).map(c => c.value);
            const pagtos = Array.from(document.querySelectorAll('.pagto-c:checked')).map(c => c.value);
            const captchas = Array.from(document.querySelectorAll('.captcha-c:checked')).map(c => c.value);
            
            const moedasInput = document.getElementById('f_moedas').value;
            const moedas = moedasInput ? moedasInput.split(',').map(m => m.trim().toLowerCase()) : [];

            ultimoObjetoGerado = {
                id: parseInt(document.getElementById('f_id').value) || 0,
                nome: document.getElementById('f_nome').value,
                url: document.getElementById('f_url').value,
                moeda: moedas,
                pagamento: pagtos.join(', '),
                tipo_principal: tipos.join(' e '),
                recursos: recursos,
                intervalo: document.getElementById('f_timer').value,
                captcha: captchas.join(' / '),
                minimo_saque: document.getElementById('f_minimo').value,
                tempo_saque: document.getElementById('f_tempo').value,
                status: document.getElementById('f_status').value,
                destaque: document.getElementById('f_destaque').value === "true",
                patrocinado: document.getElementById('f_patrocinado').value === "true",
                data_cadastro: new Date().toLocaleDateString('pt-BR')
            };

            document.getElementById('json-output').value = JSON.stringify(ultimoObjetoGerado, null, 2);
            document.getElementById('btnCloud').disabled = false;
        }

        async function enviarParaCloudflare() {
            if (!ultimoObjetoGerado) return;
            const btn = document.getElementById('btnCloud');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';
            btn.disabled = true;

            try {
                const response = await fetch(`${URL_WORKER}/admin-save-faucet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ultimoObjetoGerado)
                });

                const res = await response.json();
                if (res.success) {
                    alert("✅ MARAVILHA! Banco de Dados atualizado com sucesso.");
                } else {
                    alert("❌ Erro: " + res.error);
                }
            } catch (err) {
                alert("🚨 Erro de conexão com a Worker!");
                console.error(err);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 2. SALVAR NO BANCO DE DADOS';
                btn.disabled = false;
            }
        }

        function copiarTexto() {
            const out = document.getElementById("json-output");
            if(!out.value) return;
            out.select();
            document.execCommand("copy");
            alert("Copiado! Backup garantido.");
        }
    </script>
</body>
</html>
