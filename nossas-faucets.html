<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossas Torneiras | Brazuka Faucets</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .faucet-grid-internal {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin: -40px auto 50px;
        }
        .internal-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid #eee;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .internal-card:hover { transform: translateY(-10px); border-color: #27ae60; }
        .coin-icon-large { font-size: 3.5em; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header class="hero-ads">
        <div class="container" style="padding: 60px 20px; text-align: center;">
            <h1><i class="fas fa-faucet"></i> Torneiras Oficiais Brazuka</h1>
            <p>Pagamento instantâneo via FaucetPay. Sem taxas ocultas!</p>
            <div id="ad-content" style="margin-top: 30px; min-height: 150px; background: rgba(255,255,255,0.1); border-radius: 15px; display: flex; align-items: center; justify-content: center; border: 2px dashed rgba(255,255,255,0.3);">
                <span style="color: white; opacity: 0.6;">[ Espaço para Publicidade ]</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="faucet-grid-internal">
            
            <div class="internal-card">
                <div class="coin-icon-large" style="color: #ff0013;"><i class="fas fa-coins"></i></div>
                <h3>Torneira TRON (TRX)</h3>
                <p>Ganhe 0.001 TRX a cada 10 minutos.</p>
                <a href="#" class="btn-go" style="background: #ff0013; display: block; margin-top: 20px; padding: 15px; color: white; border-radius: 10px; text-decoration: none; font-weight: bold;">REIVINDICAR TRX</a>
            </div>

            <div class="internal-card">
                <div class="coin-icon-large" style="color: #ba9f33;"><i class="fas fa-dog"></i></div>
                <h3>Torneira Dogecoin</h3>
                <p>Ganhe 0.001 DOGE a cada 10 minutos.</p>
                <a href="#" class="btn-go" style="background: #ba9f33; display: block; margin-top: 20px; padding: 15px; color: white; border-radius: 10px; text-decoration: none; font-weight: bold;">REIVINDICAR DOGE</a>
            </div>

        </div>
    </main>

    <script src="js/script-global.js"></script>
    <script src="js/ads-manager.js"></script>
</body>
</html>
