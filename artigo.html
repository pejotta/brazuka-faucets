<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo-brazuka.png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Biblioteca Iconify obrigatória para renderizar as estrelas e as logos sociais -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    
    <!-- Dinâmico via JS -->
    <title id="meta-title">Carregando Artigo | Brazuka Faucets</title>
    <meta id="meta-desc" name="description" content="Carregando análise e conteúdos do Brazuka Faucets." />
    <meta id="og-title" property="og:title" content="Brazuka Faucets" />
    <meta id="og-desc" property="og:description" content="Análises e reviews de criptomoedas." />
    <meta id="og-image" property="og:image" content="https://www.brazukafaucets.com.br/assets/brazuka-faucets-share-image.png" />
    <link id="canonical-url" rel="canonical" href="https://www.brazukafaucets.com.br" />

    <style>
        a {color: green;}
        /* Estilos e adaptação nativa para o Modo Escuro */
        article {
            background: var(--card-bg, #fff);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--card-border, #eaeaea);
            color: var(--text-color, #333);
            transition: background 0.3s, border-color 0.3s;
        }

        #artigo-cabecalho {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--card-border, #eee);
            padding-bottom: 20px;
        }

        #artigo-categoria {
            background: #f3ebff;
            color: #7a33eb;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        [data-theme="dark"] #artigo-categoria {
            background: rgba(122, 51, 235, 0.25);
            color: #b07cff;
        }

        #artigo-titulo {
            font-size: 2rem;
            margin: 15px 0 10px 0;
            color: var(--text-color, #111);
            line-height: 1.3;
        }

        #artigo-data {
            font-size: 0.85rem;
            color: var(--nav-text, #777);
        }
        
        #artigo-corpo {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-color, #333);
        }

        #artigo-corpo p, 
        #artigo-corpo li, 
        #artigo-corpo span {
            color: inherit;
        }

        #artigo-corpo h2, 
        #artigo-corpo h3, 
        #artigo-corpo h4 {
            color: var(--text-color, #111);
            margin-top: 25px;
            margin-bottom: 15px;
        }

        /* Estilos do bloco de engajamento e compartilhamento */
        .engagement-container {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            background: var(--card-bg, #fff);
            border: 1px solid var(--card-border, #eaeaea);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap; 
        }

        .engagement-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stars {
            display: flex;
            gap: 2px;
            color: #f2a900;
            font-size: 28px;
            cursor: pointer;
        }

        #rating-status {
            font-size: 14px;
            font-weight: bold;
            color: var(--footer-text, #777);
            min-width: 60px;
        }

        .social-grid {
            display: flex;
            gap: 8px;
        }

        .btn-share {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-share:hover { transform: translateY(-3px); }

        .wa { background: #25d366; }
        .tg { background: #0088cc; }
        .fb { background: #1877f2; }
        .tw { background: #000; }
        .rd { background: #ff4500; }
        .ml { background: #888; }
    </style>
</head>
<body>

    <!-- BANNER TOPO GERAL -->
    <div style="max-width: 900px; margin: 20px auto; padding: 0 15px;">
        <div class="ad-slot-top" id="ad-zone-home-top" data-ad-zone="homeTop"></div>
    </div>

    <main class="container" style="max-width: 900px; padding: 20px 15px 60px 15px;">
        <div style="margin-bottom: 20px;">
            <a href="blog.html" style="color: #7a33eb; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                ← Voltar para o Blog
            </a>
        </div>

        <article>
            <div id="artigo-cabecalho">
                <span id="artigo-categoria">Categoria</span>
                <h1 id="artigo-titulo">Carregando título...</h1>
                <div id="artigo-data">Publicado em --/--/----</div>                            
            </div>

            <!-- Imagem de Capa -->
            <div id="artigo-imagem-container" style="margin-bottom: 25px; border-radius: 8px; overflow: hidden; display: none;">
                <img id="artigo-imagem" src="" alt="" style="width: 100%; max-height: 450px; object-fit: cover;">
            </div>

            <!-- Corpo do Texto -->
            <div id="artigo-corpo">
                <p style="text-align: center; padding: 40px;">Carregando conteúdo do artigo...</p>
            </div>
        </article>

        <!-- Bloco de Engajamento e Compartilhamento -->
        <div class="engagement-container">
            <div class="engagement-item">
                <div class="stars" id="user-rating">
                    <iconify-icon icon="ic:round-star-border" data-value="1"></iconify-icon>
                    <iconify-icon icon="ic:round-star-border" data-value="2"></iconify-icon>
                    <iconify-icon icon="ic:round-star-border" data-value="3"></iconify-icon>
                    <iconify-icon icon="ic:round-star-border" data-value="4"></iconify-icon>
                    <iconify-icon icon="ic:round-star-border" data-value="5"></iconify-icon>
                </div>
                <span id="rating-status">Avalie!</span>
            </div>

            <div class="engagement-item social-grid">
                <button type="button" id="share-wa" class="btn-share wa" style="border:none;"><iconify-icon icon="ic:baseline-whatsapp"></iconify-icon></button>
                <button type="button" id="share-tg" class="btn-share tg" style="border:none;"><iconify-icon icon="ic:baseline-telegram"></iconify-icon></button>
                <button type="button" id="share-fb" class="btn-share fb" style="border:none;"><iconify-icon icon="ic:baseline-facebook"></iconify-icon></button>
                <button type="button" id="share-tw" class="btn-share tw" style="border:none;"><iconify-icon icon="simple-icons:x"></iconify-icon></button>
                <button type="button" id="share-rd" class="btn-share rd" style="border:none;"><iconify-icon icon="ic:baseline-reddit"></iconify-icon></button>
                <button type="button" id="share-ml" class="btn-share ml" style="border:none;"><iconify-icon icon="ic:baseline-email"></iconify-icon></button>
            </div>
        </div>
    </main>

    <!-- Script Globais e Ads -->
    <script src="js/script-global.js"></script>
    <script src="js/ads-manager.js"></script>
    <script>
    const URL_WORKER = "https://brazuka-faucets.moneynanet-yt.workers.dev";

    async function carregarArtigoIndividual() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        if (!slug) {
            document.getElementById('artigo-corpo').innerHTML = '<h2 style="color:red; text-align:center;">Artigo não especificado.</h2>';
            return;
        }

        try {
            const res = await fetch(URL_WORKER + '/get-posts');
            const posts = await res.json();

            if (!Array.isArray(posts)) throw new Error("Formato inválido");

            const post = posts.find(p => p.slug === slug);

            if (!post) {
                document.getElementById('artigo-corpo').innerHTML = '<h2 style="text-align:center;">Artigo não encontrado ou removido.</h2>';
                document.getElementById('artigo-titulo').innerText = "Artigo não encontrado";
                return;
            }

            // 1. TÍTULO DA ABA E SEO IMEDIATO
            const tituloCompleto = post.title + " | Brazuka Faucets";
            document.title = tituloCompleto;
            
            // 2. ATUALIZAÇÃO FORÇADA DAS META TAGS DE COMPARTILHAMENTO (OPEN GRAPH)
            document.getElementById('meta-title').innerText = tituloCompleto;
            
            const descricaoFinal = post.metaDescription || post.title;
            document.getElementById('meta-desc').setAttribute('content', descricaoFinal);
            document.getElementById('og-title').setAttribute('content', post.title);
            document.getElementById('og-desc').setAttribute('content', descricaoFinal);
            
            if (post.image) {
                document.getElementById('og-image').setAttribute('content', post.image);
            }
            document.getElementById('canonical-url').setAttribute('href', window.location.href);

            // 3. PREENCHIMENTO VISUAL DA PÁGINA
            document.getElementById('artigo-categoria').innerText = post.category || 'Geral';
            document.getElementById('artigo-titulo').innerText = post.title;
            document.getElementById('artigo-data').innerText = "Publicado em " + new Date(post.createdAt).toLocaleDateString('pt-BR');

            if (post.image) {
                const imgEl = document.getElementById('artigo-imagem');
                imgEl.src = post.image;
                imgEl.alt = post.title;
                document.getElementById('artigo-imagem-container').style.display = 'block';
            }

            document.getElementById('artigo-corpo').innerHTML = post.content;

            // 4. RENDERIZA AS ESTRELAS COM BASE NA MÉDIA JÁ SALVA NO BANCO
            const mediaAtual = post.mediaRating ? parseFloat(post.mediaRating) : 0;
            const totalVotos = post.ratings && post.ratings.count ? post.ratings.count : 0;
            
            const estrelas = document.querySelectorAll('#user-rating iconify-icon');
            const statusRating = document.getElementById('rating-status');

            // Pinta as estrelas conforme a média salva (arredondada para baixo/inteiro)
            const mediaInteira = Math.round(mediaAtual);
            estrelas.forEach((s, i) => {
                s.setAttribute('icon', i < mediaInteira ? 'ic:round-star' : 'ic:round-star-border');
            });

            if (totalVotos > 0) {
                statusRating.innerText = `${mediaAtual} (${totalVotos})`;
            } else {
                statusRating.innerText = "Avalie!";
            }

            // Reexecuta o gerenciador de anúncios para injetar banners dentro do texto
            if (typeof BRAZUKA_ADS !== 'undefined' && typeof BRAZUKA_ADS.render === 'function') {
                BRAZUKA_ADS.render();
            }

        } catch (err) {
            console.error("Erro ao carregar artigo:", err);
            document.getElementById('artigo-corpo').innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar o artigo. Tente atualizar a página.</p>';
        }
    }

    // Inicialização única após carregar o DOM
    document.addEventListener("DOMContentLoaded", () => {
        carregarArtigoIndividual();

        // Configuração dinâmica dos botões sociais
        const getShareData = () => {
            const urlAtual = encodeURIComponent(window.location.href);
            const tituloLimpo = document.title.replace(" | Brazuka Faucets", "").trim();
            const tituloAtual = encodeURIComponent(tituloLimpo);
            const metaDescEl = document.querySelector('meta[name="description"]');
            const descTexto = metaDescEl ? metaDescEl.getAttribute('content') : tituloLimpo;
            const descAtual = encodeURIComponent(descTexto);
            return { urlAtual, tituloAtual, descAtual, tituloLimpo };
        };

        const wa = document.getElementById('share-wa');
        const tg = document.getElementById('share-tg');
        const fb = document.getElementById('share-fb');
        const tw = document.getElementById('share-tw');
        const rd = document.getElementById('share-rd');
        const ml = document.getElementById('share-ml');

        if (wa) {
            wa.addEventListener('click', () => {
                const data = getShareData();
                const texto = encodeURIComponent(`🔥 *${data.tituloLimpo}*\n\nConfira os detalhes completos aqui: `) + data.urlAtual;
                window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank', 'noopener');
            });
        }

        if (tg) {
            tg.addEventListener('click', () => {
                const data = getShareData();
                const textoTelegram = encodeURIComponent(`${data.tituloLimpo}\n\n${decodeURIComponent(data.urlAtual)}`);
                window.open(`https://t.me/share/url?url=${textoTelegram}`, '_blank', 'noopener');
            });
        }

        if (fb) {
            fb.addEventListener('click', () => {
                const data = getShareData();
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${data.urlAtual}`, '_blank', 'noopener');
            });
        }

        if (tw) {
            tw.addEventListener('click', () => {
                const data = getShareData();
                window.open(`https://twitter.com/intent/tweet?text=${data.tituloAtual}&url=${data.urlAtual}`, '_blank', 'noopener');
            });
        }

        if (rd) {
            rd.addEventListener('click', () => {
                const data = getShareData();
                window.open(`https://reddit.com/submit?url=${data.urlAtual}&title=${data.tituloAtual}`, '_blank', 'noopener');
            });
        }

        if (ml) {
            ml.addEventListener('click', () => {
                const data = getShareData();
                window.open(`mailto:?subject=${data.tituloAtual}&body=Confira%20este%20artigo:%20${data.urlAtual}`, '_blank');
            });
        }

        // Lógica de Avaliação por Estrelas
        const estrelas = document.querySelectorAll('#user-rating iconify-icon');
        const statusRating = document.getElementById('rating-status');

        estrelas.forEach((estrela, index) => {
            estrela.addEventListener('mouseenter', () => {
                estrelas.forEach((s, i) => {
                    s.setAttribute('icon', i <= index ? 'ic:round-star' : 'ic:round-star-border');
                });
            });

            estrela.addEventListener('click', async () => {
                const nota = parseInt(estrela.getAttribute('data-value')) || (index + 1);
                const urlParams = new URLSearchParams(window.location.search);
                const slug = urlParams.get('slug');

                if (!slug) return alert("Slug do artigo não encontrado.");

                try {
                    const res = await fetch(URL_WORKER + '/rate-post', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ slug, rating: nota })
                    });
                    const data = await res.json();
                    if (data.success) {
                        statusRating.innerText = `${data.media} (${data.totalVotos})`;
                        estrelas.forEach((s, i) => {
                            s.setAttribute('icon', i < Math.round(data.media) ? 'ic:round-star' : 'ic:round-star-border');
                        });
                    } else {
                        alert("Erro ao registrar avaliação: " + (data.error || 'Desconhecido'));
                    }
                } catch (err) {
                    console.error("Erro ao enviar avaliação:", err);
                    alert("Erro de conexão ao enviar avaliação.");
                }
            });
        });

        const userRatingContainer = document.getElementById('user-rating');
        if (userRatingContainer) {
            userRatingContainer.addEventListener('mouseleave', () => {
                // Mantém o estado atual carregado
            });
        }
    });
</script>
</body>
</html>
