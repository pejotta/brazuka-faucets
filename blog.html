<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo-brazuka.png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <title>Blog & Reviews | Brazuka Faucets</title>
    <meta name="description" content="Confira análises completas, reviews de faucets, notícias e guias para ganhar criptomoedas com segurança." />
    <link rel="canonical" href="https://www.brazukafaucets.com.br/blog.html" />
</head>
<body>

    <!-- BANNER TOPO GERAL -->
    <div style="max-width: 1200px; margin: 20px auto; padding: 0 15px;">
        <div class="ad-slot-top" id="ad-zone-home-top" data-ad-zone="homeTop"></div>
    </div>

    <main class="container" style="padding-top: 20px; padding-bottom: 50px;">
        <section class="headline" style="text-align: center; margin-bottom: 40px;">
            <h1>BLOG & REVIEWS BRAZUKA</h1>
            <p>Artigos, análises de plataformas e estratégias para maximizar seus ganhos em cripto.</p>
        </section>

        <!-- Grade de Artigos -->
        <div id="blog-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;">
            <p style="text-align: center; color: #777; grid-column: 1 / -1; padding: 40px;">Carregando artigos do blog...</p>
        </div>
    </main>

    <!-- Script Globais e Ads -->
    <script src="js/script-global.js"></script>
    <script src="js/ads-manager.js"></script>
    <script>
        const URL_WORKER = "https://brazuka-faucets.moneynanet-yt.workers.dev";

        async function carregarBlogPublico() {
    try {
        const res = await fetch(URL_WORKER + '/get-posts');
        const posts = await res.json();
        const container = document.getElementById('blog-grid');

        if (!Array.isArray(posts) || posts.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #777; grid-column: 1 / -1; padding: 40px;">Nenhum artigo publicado no momento. Volte em breve!</p>';
            return;
        }

        // Separa o post fixado (pinned) dos demais
        const postFixado = posts.find(p => p.pinned === true);
        const postsNormais = posts.filter(p => p !== postFixado);

        let htmlFinal = '';

        // Se houver um post fixado, renderiza ele em destaque absoluto no topo
        if (postFixado) {
            htmlFinal += `
                <article style="grid-column: 1 / -1; background: linear-gradient(135deg, #f9f5ff 0%, #fff 100%); border: 2px solid #7a33eb; border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); box-shadow: 0 10px 25px rgba(122, 51, 235, 0.1); margin-bottom: 30px;">
                    ${postFixado.image ? `<div style="min-height: 250px; overflow: hidden;"><img src="${postFixado.image}" alt="${postFixado.title}" style="width: 100%; height: 100%; object-fit: cover;"></div>` : ''}
                    <div style="padding: 30px; display: flex; flex-direction: column; justify-content: center;">
                        <div style="margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                            <span style="background: #7a33eb; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">⭐ DESTAQUE FIXO</span>
                            ${postFixado.badge ? `<span style="background: #e1f5fe; color: #0288d1; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;">[${postFixado.badge}]</span>` : ''}
                            <span style="font-size: 0.85rem; color: #888;">${new Date(postFixado.createdAt).toLocaleDateString('pt-BR')}</span>
                        </div>
                        <h2 style="font-size: 1.8rem; margin: 0 0 15px 0; color: #111; line-height: 1.3;">
                            <a href="artigo.html?slug=${postFixado.slug}" style="text-decoration: none; color: inherit;">${postFixado.title}</a>
                        </h2>
                        <p style="color: #555; font-size: 1rem; line-height: 1.6; margin-bottom: 25px;">
                            ${postFixado.metaDescription || ''}
                        </p>
                        <div>
                            <a href="artigo.html?slug=${postFixado.slug}" style="display: inline-block; background: #7a33eb; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">
                                Ler Matéria em Destaque →
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        // Renderiza os demais posts normais em grade
        htmlFinal += postsNormais.map(post => `
            <article style="background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #eaeaea; display: flex; flex-direction: column; transition: transform 0.2s ease, box-shadow 0.2s ease;">
                ${post.image ? `<div style="height: 180px; overflow: hidden;"><img src="${post.image}" alt="${post.title}" style="width: 100%; height: 100%; object-fit: cover;"></div>` : ''}
                <div style="padding: 20px; display: flex; flex-direction: column; flex-grow: 1;">
                    <div style="margin-bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                        <span style="background: #f3ebff; color: #7a33eb; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">${post.category || 'Geral'}</span>
                        ${post.badge ? `<span style="background: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold;">[${post.badge}]</span>` : ''}
                        <span style="font-size: 0.8rem; color: #888; margin-left: auto;">${new Date(post.createdAt).toLocaleDateString('pt-BR')}</span>
                    </div>
                    <h2 style="font-size: 1.25rem; margin: 0 0 10px 0; color: #222; line-height: 1.4;">
                        <a href="artigo.html?slug=${post.slug}" style="text-decoration: none; color: inherit;">${post.title}</a>
                    </h2>
                    <p style="color: #666; font-size: 0.92rem; line-height: 1.5; margin-bottom: 20px; flex-grow: 1;">
                        ${post.metaDescription || ''}
                    </p>
                    <a href="artigo.html?slug=${post.slug}" style="display: inline-block; background: #7a33eb; color: #fff; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                        Ler Artigo Completo →
                    </a>
                </div>
            </article>
        `).join('');

        container.innerHTML = htmlFinal;

    } catch (err) {
        console.error("Erro ao carregar posts:", err);
        document.getElementById('blog-grid').innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Erro ao carregar os artigos. Tente novamente mais tarde.</p>';
    }
}

        carregarBlogPublico();
    </script>
</body>
</html>
