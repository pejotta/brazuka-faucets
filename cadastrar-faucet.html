    <style>
        .hero-ads {
            text-align: center; padding: 60px 20px;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white; border-radius: 0 0 50px 50px; max-width: 1200px; margin: 0 auto;
        }
        .hero-ads h1 { font-size: 2.5em; margin-bottom: 10px; }
        .hero-ads p { opacity: 0.9; font-size: 1.1em; }
        
        .faucet-form-container {
            max-width: 600px; margin: 50px auto; background: #ffffff;
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative; z-index: 2;
        }
        .faucet-form h2 { color: #1a73e8; margin-bottom: 25px; text-align: center; font-size: 1.6em; }
        .faucet-form label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 0.95em; }
        .faucet-form input, .faucet-form select, .faucet-form textarea {
            width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1em; box-sizing: border-box;
        }
        .recursos-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px;
        }
        .recursos-item { display: flex; align-items: center; font-size: 0.9em; font-weight: normal !important; }
        .recursos-item input { width: auto; margin-bottom: 0; margin-right: 8px; }
        .faucet-form button {
            width: 100%; background-color: #1a73e8; color: white; padding: 15px;
            border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .faucet-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .banner-lateral {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 160px; height: 600px; background-color: #eee;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #ddd; font-size: 12px; color: #666; z-index: 1;
        }
        .banner-left { left: 20px; } .banner-right { right: 20px; }
        .campo-dinamico { background: #eef5ff; padding: 10px; border-radius: 8px; border: 1px dashed #1a73e8; margin-bottom: 20px; }
        
        @media (max-width: 1000px) { .banner-lateral { display: none; } }
    </style>
</head>
<body>
 

    <div class="banner-lateral banner-left">
        <div class="ad-slot-cadastro"></div>
    </div>

    <div class="banner-lateral banner-right">
        <div class="ad-slot-cadastro"></div>
    </div>

    <section class="hero-ads">
        <h1>Cadastre seu site</h1>
        <p>Airdrop, Faucet, Mineradora ou Autofaucet.</p>
        <p><strong>IMPORTANTE!</strong>: Aceitamos links de indicação.</p>
    </section>
    
    <main class="container">
        <div class="faucet-form-container">
            <form action="https://formspree.io/f/mjgbvzbq" method="POST" class="faucet-form">
                <h2><i class="fa-solid fa-magnifying-glass-chart"></i> Auditoria de Nova Faucet</h2>
                
                <label>Nome da Faucet *</label>
                <input type="text" name="nome" placeholder="Ex: Brazuka Claimer" required>

                <label>URL da Faucet *</label>
                <input type="url" name="url" placeholder="https://..." required>

                <label>E-mail para contato *</label>
                <input type="email" name="email" placeholder="seu-email@exemplo.com" required>
                
                <label>Moedas Principais *</label>
                <div class="recursos-group">
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="btc"> BTC</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="eth"> ETH</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="doge"> DOGE</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="ltc"> LTC</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="sol"> SOL</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="trx"> TRX</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="bnb"> BNB</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="zer"> ZER</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="usdt"> USDT</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="xrp"> XRP</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="ada"> ADA</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="pol"> POL</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="central"> Central Multimoedas</label>
                    <label class="recursos-item"><input type="checkbox" name="moeda[]" value="outra" id="check-outra-moeda"> Outra</label>
                </div>

                <div id="campo-outra-moeda" class="campo-dinamico" style="display: none;">
                    <label>Especifique a moeda:</label>
                    <input type="text" id="input-outra-moeda" name="outra_moeda_txt" placeholder="Ex: Solana, Banano...">
                </div>

                <label>Classificação Principal *</label>
                <select name="tipo_principal" required>
                    <option value="faucet_padrao">Faucet Padrão (Manual)</option>
                    <option value="autofaucet">Auto Faucet</option>
                    <option value="jogo">Jogo</option>
                    <option value="central_faucets">Central de Faucets / Multi-tarefas</option>
                    <option value="mineradora">Mineradora (Web/Cloud)</option>
                </select>

                <label>Recursos Disponíveis:</label>
                <div class="recursos-group">
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="faucet"> Faucet</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="bonus"> Bônus Diário</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="ptc"> PTC (Ads)</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="videos"> Ver Vídeos</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="concurso"> Concurso/Contest</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="mineracao"> Mineração</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="shortlinks"> Shortlinks</label>        
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="surveys"> Surveys (Pesquisas)</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="staking"> Staking</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="jobs"> Trabalhos</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="surfads"> SurfAds</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="microtasks"> Micro Tarefas</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="jogos"> Jogos/Dice</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="offerwall"> Offerwalls</label>
                    <label class="recursos-item"><input type="checkbox" name="recursos[]" value="referencias"> Referências/Afiliados</label>
                </div>

                <label>Intervalo do Timer *</label>
                <input type="text" name="timer_intervalo" placeholder="Ex: 5 minutos / Sem timer" required>

                <label>Tipos de Captcha Utilizados:</label>
                <div class="recursos-group">
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="reCAPTCHA"> reCAPTCHA</label>
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="hCaptcha"> hCaptcha</label>
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="Turnstile"> Turnstile</label>
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="IconCaptcha"> IconCaptcha</label>
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="Antibot"> Antibot Links</label>
                    <label class="recursos-item"><input type="checkbox" name="captchas[]" value="Custom"> Captcha Próprio</label>
                </div>

                <label>Onde é feito o pagamento? *</label>
                <div class="recursos-group">
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="FaucetPay"> FaucetPay</label>                      
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Metamask"> Metamask</label>                                        
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Base"> Base</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Coinbase"> Coinbase</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Payeer"> Payeer</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Cwallet"> Cwallet</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Binance"> Binance</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="PIX"> PIX</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="PayPal"> PayPal</label> 
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Lightning Network"> Lightning Network</label>                      
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Gift Cards"> Gift Cards</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="Carteira Direta"> Carteira Direta (BTC, LTC, BNB, etc ...)</label>
                    <label class="recursos-item"><input type="checkbox" name="pagamento[]" value="outros" id="check-outro-pagamento"> Outros</label>
                </div>

                <div id="campo-outro-pagamento" class="campo-dinamico" style="display: none;">
                    <label>Especifique o método:</label>
                    <input type="text" id="input-outro-pagamento" name="outro_pagamento_txt">
                </div>
                
                <label>Mínimo de Saque *</label>
                <input type="text" name="minimo_saque" placeholder="Ex: 0.005 USD" required>
                
                <label>Frequência/Tempo de Saque *</label>
                <input type="text" name="tempo_saque" placeholder="Ex: Imediato" required>

                <label>Observações (Opcional)</label>
                <textarea name="observacoes" rows="3"></textarea>
                
                <div class="cf-turnstile" data-sitekey="0x4AAAAAACIz3XQpjGaXppF0" data-callback="onTurnstileSuccess"></div>
                <button type="submit" id="btn-cadastrar" disabled>🚀 Enviar para Auditoria</button>
            </form>
        </div>
    </main>

    <script>
        const btn = document.getElementById('btn-cadastrar');
        window.onTurnstileSuccess = (token) => {
            btn.disabled = false;
        };

        function toggleOutro(checkId, containerId, inputId) {
            const check = document.getElementById(checkId);
            const container = document.getElementById(containerId);
            const input = document.getElementById(inputId);
            check.addEventListener('change', function() {
                container.style.display = this.checked ? 'block' : 'none';
                if(this.checked) input.setAttribute('required', 'required');
                else input.removeAttribute('required');
            });
        }
        toggleOutro('check-outra-moeda', 'campo-outra-moeda', 'input-outra-moeda');
        toggleOutro('check-outro-pagamento', 'campo-outro-pagamento', 'input-outro-pagamento');
    </script>
    <script src="js/ticker-data.js"></script>
<script src="js/script-global.js"></script>
    <script src="js/cadastrar.js"></script>
</body>
