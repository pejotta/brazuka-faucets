<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Faucet | Brazuka Faucets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<style>
    /* Estilos para o Formulário de Cadastro */
.faucet-form-container {
    max-width: 600px;
    margin: 50px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.faucet-form h2 {
    color: #1a73e8;
    margin-bottom: 25px;
    text-align: center;
    font-size: 1.6em;
}

.faucet-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
    font-size: 0.95em;
}

.faucet-form input, 
.faucet-form select, 
.faucet-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.faucet-form input:focus, 
.faucet-form select:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    outline: none;
}

.faucet-form button {
    width: 100%;
    background-color: #1a73e8;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
}

.faucet-form button:hover {
    background-color: #0d60d8;
    transform: translateY(-2px);
}

.faucet-form button:active {
    transform: translateY(0);
}
</style>
    <main class="container">
        <div class="faucet-form-container">
            <form action="https://formspree.io/f/mjgbvzbq" method="POST" class="faucet-form">
                <h2><i class="fa-solid fa-plus-circle"></i> Sugerir Nova Faucet</h2>
                
                <label for="faucet-nome">Nome da Faucet *</label>
                <input type="text" id="faucet-nome" name="nome" placeholder="Ex: Brazuka Claimer" required>

                <label for="faucet-url">URL da Faucet *</label>
                <input type="url" id="faucet-url" name="url" placeholder="https://..." required>
                
                <label for="faucet-moeda">Moeda Principal *</label>
                <select id="faucet-moeda" name="moeda" required>
                    <option value="">-- Selecione a Cripto --</option>
                    <option value="btc">Bitcoin (BTC)</option>
                    <option value="eth">Ethereum (ETH)</option>
                    <option value="doge">Dogecoin (DOGE)</option>
                    <option value="ltc">Litecoin (LTC)</option>
                    <option value="sol">Solana (SOL)</option>
                    <option value="trx">Tron (TRX)</option>
                    <option value="usdt">Tether (USDT)</option>
                    <option value="fey">Feyorra (FEY)</option>
                    <option value="bnb">Binance Coin (BNB)</option>
                    <option value="matic">Polygon (MATIC)</option>
                    <option value="central">Central Multimoedas (30+ moedas)</option>
                    <option value="outra">Outra (especificar nos detalhes)</option>
                </select>
                
                <label for="faucet-tipo">Tipo de Faucet *</label>
                <select id="faucet-tipo" name="tipo" required>
                    <option value="padrao">Faucet Padrão (Manual)</option>
                    <option value="auto">Auto Faucet</option>
                    <option value="shortlink">Shortlinks / Offerwalls</option>
                </select>
                
                <label for="faucet-minimo">Mínimo de Saque *</label>
                <input type="text" id="faucet-minimo" name="minimo_saque" placeholder="Ex: 100 Satoshis / Sem mínimo" required>
                
                <label for="faucet-tempo">Frequência de Coleta *</label>
                <input type="text" id="faucet-tempo" name="tempo_saque" placeholder="Ex: 5 min / Imediato" required>

                <label for="faucet-obs">Observações Adicionais (Opcional)</label>
                <textarea id="faucet-obs" name="observacoes" rows="3" placeholder="Algo mais que devemos saber?"></textarea>
                
                <button type="submit">Enviar para Análise</button>
            </form>
        </div>
    </main>

    <script src="script-global.js"></script>
</body>
</html>
