<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/assets/logo-brazuka.png" sizes="32x32">
    <link rel="shortcut icon" href="/assets/logo-brazuka.png">
    <link rel="apple-touch-icon" href="/assets/logo-brazuka.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Apps | Brazuka Faucets</title>
    <meta name="description" content="Baixe e utilize os melhores aplicativos e plataformas mobile auditadas para ganho de criptomoedas." />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .apps-hero { 
            text-align: center; padding: 50px 20px; 
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); 
            color: white; border-radius: 0 0 40px 40px; margin-bottom: 30px; 
        }
        .apps-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 15px 50px; 
        }
        
        /* Vitrine com suporte automático ao Dark Mode do style.css */
        .app-store-card { 
            background: var(--card-bg, #ffffff); 
            border-radius: 12px; padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            display: flex; flex-direction: column; justify-content: space-between; 
            border: 1px solid var(--card-border, #eee); 
            transition: transform 0.2s, background-color 0.3s ease, border-color 0.3s ease; 
        }
        .app-store-card:hover { transform: translateY(-3px); }
        .app-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .app-icon { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: #f0f2f5; }
        .app-info h3 { margin: 0 0 5px; font-size: 1.1em; color: var(--text-color, #333); }
        .app-info span { font-size: 0.8em; color: var(--text-muted, #666); }
        
        .app-badge { 
            background: rgba(39, 174, 96, 0.15); color: #27ae60; 
            font-size: 0.75em; padding: 4px 10px; border-radius: 6px; 
            font-weight: bold; display: inline-block; margin-bottom: 10px; 
        }
        
        .app-details-text { font-size: 0.85em; color: var(--text-color, #555); margin: 6px 0; }
        
        .btn-download { 
            background: #27ae60; color: white; text-align: center; padding: 12px; 
            border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; 
            display: block; transition: background 0.2s; 
        }
        .btn-download:hover { background: #219653; }

        .search-app-input {
            width: 100%; padding: 14px; 
            border: 1px solid var(--card-border, #ddd); 
            background-color: var(--card-bg, #fff); 
            color: var(--text-color, #333); 
            border-radius: 8px; font-size: 1em; outline: none;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="apps-hero">
        <h1>📱 Vitrine de Aplicativos & Sites Mobile</h1>
        <p>Plataformas auditadas que possuem suporte ou aplicativo dedicado para celular.</p>
    </section>

    <main>
        <div style="max-width: 600px; margin: 0 auto 30px; padding: 0 15px;">
            <input type="text" id="search-app" class="search-app-input" placeholder="🔍 Buscar aplicativo por nome...">
        </div>

        <div id="apps-container" class="apps-grid">
            <p style="text-align: center; grid-column: 1 / -1; color: var(--text-color, #666);">Carregando vitrine de apps...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/script-global.js"></script>
    <script>
        const WORKER_URL = "https://brazuka-faucets.moneynanet-yt.workers.dev";

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${WORKER_URL}/get-all-faucets`);
                const faucets = await response.json();
                
                // Filtra apenas faucets que possuem app configurado
                const appsList = faucets.filter(f => {
                    if (f.status === 'scam') return false;
                    const plats = Array.isArray(f.plataforma) ? f.plataforma : (f.plataforma ? [f.plataforma] : ['site']);
                    return plats.includes('app');
                });

                renderApps(appsList);

                document.getElementById('search-app').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = appsList.filter(a => a.nome.toLowerCase().includes(term));
                    renderApps(filtered);
                });

            } catch (err) {
                console.error("Erro ao carregar apps:", err);
                document.getElementById('apps-container').innerHTML = '<p style="text-align:center; color:red;">Erro ao carregar a vitrine de aplicativos.</p>';
            }
        });

        function renderApps(list) {
            const container = document.getElementById('apps-container');
            if (list.length === 0) {
                container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: var(--text-color, #666);">Nenhum aplicativo encontrado.</p>';
                return;
            }

            container.innerHTML = list.map(app => {
                const domain = (app.url || '').replace(/^(https?:\/\/)/, '').split('/')[0];
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
                const moedasStr = Array.isArray(app.moeda) ? app.moeda.join(', ').toUpperCase() : (app.moeda || '').toUpperCase();

                return `
                    <div class="app-store-card">
                        <div>
                            <div class="app-header">
                                <img src="${faviconUrl}" class="app-icon" alt="${app.nome}">
                                <div class="app-info">
                                    <h3>${app.nome}</h3>
                                    <span>${domain}</span>
                                </div>
                            </div>
                            <span class="app-badge"><i class="fa-solid fa-mobile-screen-button"></i> App Disponível</span>
                            <p class="app-details-text"><strong>Moedas/Tipo:</strong> ${moedasStr}</p>
                            <p class="app-details-text"><strong>Min. Saque:</strong> ${app.minimo_saque || '---'}</p>
                        </div>
                        <a href="faucet.html?id=${app.id}" class="btn-download">ACESSAR / DETALHES</a>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
